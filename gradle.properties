# Gradle
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# WICHTIG: Diese drei Werte bitte vor dem Bauen auf https://fabricmc.net/develop/
# gegenpruefen - ich habe hier keinen Internetzugriff und kann sie nicht live
# gegen die Fabric-Meta-API validieren. Setze dort einfach "1.21.11" als
# Minecraft-Version ein und kopiere die dort angezeigten aktuellen Strings hierher.
minecraft_version=1.21.11
# Yarn mappings — die Build-Nummer kann variieren, build.1 ist in der Regel ok
yarn_mappings=1.21.11+build.1
# Aktualisiert auf empfohlene Loader-Version für 1.21.11
loader_version=0.18.1

# Mod Properties
mod_version=1.0.0
maven_group=net.larpblocks
archives_base_name=larpblocks

# Dependencies
# Ebenfalls auf https://fabricmc.net/develop/ (Abschnitt "Fabric API") pruefen,
# welche Version zu 1.21.11 passt. Ich habe hier eine aktuelle empfohlene Version gesetzt.
fabric_version=0.140.2+1.21.11
